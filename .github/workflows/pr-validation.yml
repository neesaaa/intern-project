name: PR Validation - Build Check

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/user-dashboard/**'
      - '.github/workflows/pr-validation.yml'

jobs:
  react-build-check:
    name: React Build Validation
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend/user-dashboard

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js v22.19.0
      uses: actions/setup-node@v4
      with:
        node-version: '22.19.0'
        cache: 'npm'
        cache-dependency-path: './frontend/user-dashboard/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build